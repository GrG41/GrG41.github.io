<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- 小爪门面的背景：自绘，无外部素材。
       参考图给的感觉是「暗场 + 一道斜的光柱 + 极淡的技术网格」；
       这里只用渐变、一个模糊光柱和一层网格，尽量压低对比，别跟正文抢。 -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1a2532"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.20" cy="0.04" r="0.78">
      <stop offset="0" stop-color="#84c5ff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#84c5ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#84c5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#cfe6ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#e8eef5" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <path d="M300 -160 L560 -160 L300 1160 L20 1160 Z" fill="url(#shaft)" filter="url(#soft)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
