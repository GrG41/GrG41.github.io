<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- 小爪门面的背景：全部自绘，无外部素材、无许可问题。
       毛玻璃需要「后面有东西可看」，所以这张比上一版多两层结构：
       大块柔光 + 双层网格 + 几条斜向光带 + 暗角。亮度仍压在正文对比度允许的范围内。 -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1b2735"/><stop offset="0.5" stop-color="#111721"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.08" r="0.72">
      <stop offset="0" stop-color="#84c5ff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#84c5ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#84c5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.72" r="0.64">
      <stop offset="0" stop-color="#7affd8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7affd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.55" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b98cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cfe6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridS" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#e8eef5" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="gridL" width="168" height="168" patternUnits="userSpaceOnUse">
      <path d="M168 0H0v168" fill="none" stroke="#e8eef5" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#gridS)"/>
  <rect width="1600" height="1000" fill="url(#gridL)"/>
  <g filter="url(#soft)">
    <path d="M260 -180 L560 -180 L300 1180 L-20 1180 Z" fill="url(#shaft)"/>
    <path d="M1180 -180 L1400 -180 L1620 1180 L1360 1180 Z" fill="url(#shaft)" opacity="0.7"/>
    <circle cx="300" cy="120" r="380" fill="#84c5ff" opacity="0.10"/>
    <circle cx="1320" cy="820" r="420" fill="#7affd8" opacity="0.055"/>
  </g>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#glowC)"/>
  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
